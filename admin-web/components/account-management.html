<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCESS VisionCheck — Account Management</title>
    <link rel="stylesheet" href="account-management.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  </head>
  <body style="margin: 0; padding: 24px; background: #f1f5f9; font-family: Inter, system-ui, sans-serif">
    <div data-account-management></div>
    <script type="module">
      import { initAccountManagement } from './account-management.js'

      const root = document.querySelector('[data-account-management]')
      initAccountManagement(root, {
        apiBase: '/api',
        getToken: () => localStorage.getItem('access_admin_token'),
      })
    </script>
  </body>
</html>
