<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#1E293B">R2 vs R3 inter-rater Spearman by criterion</text>
  <line x1="40" y1="260" x2="600" y2="260" stroke="#64748B"/>
  <!-- rho scaled: bar height = rho * 200 -->
  <rect x="50" y="175.3" width="55" height="84.7" fill="#0052D4"/><text x="77" y="278" text-anchor="middle" font-size="9">sharp</text><text x="77" y="168" text-anchor="middle" font-size="9">0.424</text>
  <rect x="120" y="185.0" width="55" height="75.0" fill="#0052D4"/><text x="147" y="278" text-anchor="middle" font-size="9">blur</text><text x="147" y="178" text-anchor="middle" font-size="9">0.375</text>
  <rect x="190" y="182.9" width="55" height="77.1" fill="#0052D4"/><text x="217" y="278" text-anchor="middle" font-size="9">noise</text><text x="217" y="176" text-anchor="middle" font-size="9">0.386</text>
  <rect x="260" y="204.4" width="55" height="55.6" fill="#0052D4"/><text x="287" y="278" text-anchor="middle" font-size="9">bright</text><text x="287" y="197" text-anchor="middle" font-size="9">0.278</text>
  <rect x="330" y="202.7" width="55" height="57.3" fill="#0052D4"/><text x="357" y="278" text-anchor="middle" font-size="9">contrast</text><text x="357" y="196" text-anchor="middle" font-size="9">0.286</text>
  <rect x="400" y="188.1" width="55" height="71.9" fill="#0052D4"/><text x="427" y="278" text-anchor="middle" font-size="9">blocking</text><text x="427" y="181" text-anchor="middle" font-size="9">0.360</text>
  <rect x="470" y="218.1" width="55" height="41.9" fill="#0052D4"/><text x="497" y="278" text-anchor="middle" font-size="9">ringing</text><text x="497" y="211" text-anchor="middle" font-size="9">0.210</text>
  <rect x="540" y="200.6" width="55" height="59.4" fill="#0052D4"/><text x="567" y="278" text-anchor="middle" font-size="9">overall</text><text x="567" y="194" text-anchor="middle" font-size="9">0.297</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#64748B">N/A excluded pairwise; all p &lt; 0.05</text>
</svg>
